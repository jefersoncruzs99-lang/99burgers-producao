name: Verificação

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: chave-ficticia-para-build
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test 2>&1 | tee verif.log; exit ${PIPESTATUS[0]}
      - name: Build (inclui checagem de tipos)
        run: npm run build 2>&1 | tee -a verif.log; exit ${PIPESTATUS[0]}
      - name: TypeScript estrito
        run: npm run typecheck 2>&1 | tee -a verif.log; exit ${PIPESTATUS[0]}
      - name: Resumo do erro
        if: failure()
        run: |
          tail -n 60 verif.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > resumo.txt
          echo "::error title=Falha na verificação::$(cat resumo.txt)"
